location = /chataibox { return 302 /chataibox/; }
location = /chataibox/relay {
    proxy_pass http://127.0.0.1:39181/relay;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 90s;
    proxy_send_timeout 180s;
    proxy_buffering off;
    access_log off;
}
location = /chataibox/health {
    proxy_pass http://127.0.0.1:39181/health;
    proxy_buffering off;
    access_log off;
}
location /chataibox/ {
    alias /srv/chataibox/current/;
    index index.html;
    autoindex off;
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        text/plain txt;
        application/zip zip;
        application/vnd.android.package-archive apk;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Cache-Control "no-cache" always;
    access_log off;
}
